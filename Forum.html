	<body>
<h1>Simple Forum</h1>
<div class="container">
<h2>Post Any Questions</h2>

<input id="title" placeholder="Post title">
<textarea id="content" placeholder="Write something..."></textarea>
<button onclick="addPost()">Post</button>

<div id="posts"></div>
</div>
<footer>
		Contact Us: <a href="111-222-3333">111-222-3333</a>
	</footer>
	<script>
	$(document).ready(function(){
	$('#slider').slick({
	autoplay: true,
	centerMode: true,
	centerPadding: '0px',
    slidesToShow: 1,
	dots: false,
	arrows: false
	});
	});
	</script>

	<script>
	let posts = [];

	function addPost() {
		const title = document.getElementById("title").value;
		const content = document.getElementById("content").value;

		if (!title || !content) return alert("Fill everything");

		posts.push({ title, content });
		renderPosts();
	}

	function renderPosts() {
		let html = "";
		posts.forEach(p => {
			html += `
			<div class="post">
				<h3>${p.title}</h3>
				<p>${p.content}</p>
			</div>`;
		});

		document.getElementById("posts").innerHTML = html;
	}
	</script>
